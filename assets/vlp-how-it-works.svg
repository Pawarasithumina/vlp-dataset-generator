<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-label="VLP Lab pipeline from user configuration to saved experiment configuration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1442"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .box { fill: #151b34; stroke: #475569; stroke-width: 2; animation: lit 14s infinite; }
      .l { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .side { fill: #94a3b8; font-size: 12px; text-anchor: start; }
      .flow { stroke: url(#line); stroke-width: 3; stroke-dasharray: 6 6; fill: none; animation: dash 1s linear infinite; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .fe { fill: #7dd3fc; } .be { fill: #f0abfc; }
      .s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.s5{animation-delay:8s}.s6{animation-delay:10s}.s7{animation-delay:12s}
      @keyframes dash { to { stroke-dashoffset: -12; } }
      @keyframes lit {
        0%      { stroke: #a78bfa; fill: #2a2160; }
        12%     { stroke: #a78bfa; fill: #2a2160; }
        16%,100%{ stroke: #475569; fill: #151b34; }
      }
    </style>
  </defs>

  <rect width="560" height="640" rx="18" fill="url(#bg)"/>

  <!-- connectors -->
  <path class="flow" d="M280 70 V92"/>
  <path class="flow" d="M280 160 V182"/>
  <path class="flow" d="M280 250 V272"/>
  <path class="flow" d="M280 340 V362"/>
  <path class="flow" d="M280 430 V452"/>
  <path class="flow" d="M280 520 V542"/>

  <!-- steps -->
  <rect class="box s1" x="150" y="20"  width="260" height="50" rx="12"/>
  <rect class="box s2" x="150" y="110" width="260" height="50" rx="12"/>
  <rect class="box s3" x="150" y="200" width="260" height="50" rx="12"/>
  <rect class="box s4" x="150" y="290" width="260" height="50" rx="12"/>
  <rect class="box s5" x="150" y="380" width="260" height="50" rx="12"/>
  <rect class="box s6" x="150" y="470" width="260" height="50" rx="12"/>
  <rect class="box s7" x="150" y="560" width="260" height="50" rx="12"/>

  <text class="l" x="280" y="51">User Configuration</text>
  <text class="l" x="280" y="141">Room &amp; LED Setup</text>
  <text class="l" x="280" y="231">Receiver Configuration</text>
  <text class="l" x="280" y="321">VLP Simulation</text>
  <text class="l" x="280" y="411">RSS Calculation</text>
  <text class="l" x="280" y="501">Dataset Generation</text>
  <text class="l" x="280" y="591">Experiment Configuration Saved</text>

  <!-- side labels: which half does the work -->
  <text class="tag fe" x="40"  y="49" text-anchor="start">FRONTEND</text>
  <text class="tag fe" x="40"  y="139" text-anchor="start">FRONTEND</text>
  <text class="tag fe" x="40"  y="229" text-anchor="start">FRONTEND</text>
  <text class="tag be" x="40"  y="319" text-anchor="start">BACKEND</text>
  <text class="tag be" x="40"  y="409" text-anchor="start">BACKEND</text>
  <text class="tag be" x="40"  y="499" text-anchor="start">BACKEND</text>
  <text class="tag be" x="40"  y="589" text-anchor="start">BACKEND</text>

  <!-- travelling packet -->
  <circle r="7" fill="#fde68a">
    <animateMotion dur="14s" repeatCount="indefinite" path="M280 20 V610"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="14s" repeatCount="indefinite"/>
  </circle>
</svg>
