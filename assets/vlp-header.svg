<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="VLP Lab banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1442"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .led-glow { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d2 { animation-delay: .75s; } .d3 { animation-delay: 1.5s; } .d4 { animation-delay: 2.25s; }
      .beam { animation: flicker 3s ease-in-out infinite; }
      .title { opacity: 0; animation: rise 1.1s ease-out .2s forwards; }
      .sub { opacity: 0; animation: rise 1.1s ease-out .7s forwards; }
      .tag { opacity: 0; animation: rise 1.1s ease-out 1.1s forwards; }
      .rx { animation: sweep 7s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(.75); opacity: .55; } 50% { transform: scale(1.15); opacity: 1; } }
      @keyframes flicker { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes sweep { 0%,100% { transform: translateX(0); } 50% { transform: translateX(640px); } }
    </style>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- ceiling LEDs with light beams -->
  <g>
    <polygon class="beam" points="150,18 90,240 210,240" fill="url(#beam)"/>
    <polygon class="beam d2" points="350,18 290,240 410,240" fill="url(#beam)"/>
    <polygon class="beam d3" points="550,18 490,240 610,240" fill="url(#beam)"/>
    <polygon class="beam d4" points="750,18 690,240 810,240" fill="url(#beam)"/>
    <circle class="led-glow" cx="150" cy="18" r="30" fill="url(#glow)"/>
    <circle class="led-glow d2" cx="350" cy="18" r="30" fill="url(#glow)"/>
    <circle class="led-glow d3" cx="550" cy="18" r="30" fill="url(#glow)"/>
    <circle class="led-glow d4" cx="750" cy="18" r="30" fill="url(#glow)"/>
    <circle cx="150" cy="18" r="5" fill="#fff7d6"/>
    <circle cx="350" cy="18" r="5" fill="#fff7d6"/>
    <circle cx="550" cy="18" r="5" fill="#fff7d6"/>
    <circle cx="750" cy="18" r="5" fill="#fff7d6"/>
  </g>

  <!-- floor line + moving receiver -->
  <line x1="40" y1="212" x2="860" y2="212" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>
  <g class="rx">
    <rect x="110" y="202" width="26" height="10" rx="3" fill="#38bdf8"/>
    <circle cx="123" cy="202" r="4" fill="#e0f2fe"/>
  </g>

  <!-- text -->
  <g text-anchor="middle">
    <text class="title" x="450" y="112" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="2">VLP Lab</text>
    <text class="sub" x="450" y="148" font-size="20" fill="#cbd5e1">Visible Light Positioning simulation &amp; dataset generation</text>
    <text class="tag" x="450" y="176" font-size="14" fill="#94a3b8" letter-spacing="3">FOR RESEARCHERS AND STUDENTS</text>
  </g>
</svg>
